name: Dependency review

on:
  pull_request:

permissions: {}

jobs:
  # The job id is the check name the `charm-tech-dependency-review` ruleset
  # requires, so renaming it stops the rule from ever being satisfied.
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          # Copyleft licences need a human decision before a tool is shipped
          # with them, rather than a review that passes quietly.
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0
