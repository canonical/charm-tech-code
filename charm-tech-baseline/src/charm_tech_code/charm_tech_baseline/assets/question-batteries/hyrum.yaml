schema_version: 1
repo: hyrum
upstream: canonical/hyrum
source:
  agents_md_ref: chore/agents-md-trim
  agents_md_sha: e1803004b19a1db17580d74e080cf4b1b5ba2d13
  agents_md_sha256: bd26161dd06a11737a5eaf26efd0c71741668990a0a80145a5baf7d228c7843b
  seeded_from: roadmap/26.10/repo-setup/agents-md-validation.md (implementation follow-up 4, hyrum review-and-seed)
