[project]
name = "charm-tech-code-draft-release-notes"
version = "0.1.0"
description = "Draft a release's notes with a model, for a human to edit before publishing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "The Charm Tech team at Canonical Ltd."},
]
license = "Apache-2.0"
# None. The tool is invoked by `uvx --from git+...` on a GitHub runner, and
# talks to OpenRouter through urllib, so there is nothing for a dependency to
# do.
dependencies = []

[project.scripts]
draft-release-notes = "charm_tech_code.draft_release_notes._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_tech_code"]

[dependency-groups]
unit = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The real ruff configuration is at the root of the monorepo; extending it
# means a setting added here overrides one key rather than the whole config.
[tool.ruff]
extend = "../pyproject.toml"
