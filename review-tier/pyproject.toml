[project]
name = "charm-tech-code-review-tier"
version = "0.1.0"
description = "Decide how many approvals a pull request needs, and check it has them."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "The Charm Tech team at Canonical Ltd."},
]
license = "Apache-2.0"
# None: the check runs on every PR event, so every dependency costs.
dependencies = []

[project.scripts]
review-tier = "charm_tech_code.review_tier._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_tech_code"]

[dependency-groups]
unit = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The real ruff configuration is at the root of the monorepo; extending it
# means a setting added here overrides one key rather than the whole config.
[tool.ruff]
extend = "../pyproject.toml"
