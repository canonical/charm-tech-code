[project]
name = "charm-tech-code-agents-md"
version = "0.1.0"
description = "Check that a repository's AGENTS.md is current and load-bearing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "The Charm Tech team at Canonical Ltd."},
]
license = "Apache-2.0"
# PyYAML only, for the question batteries. Everything else is stdlib, and
# `gh` and `git` are called as subprocesses rather than through a library.
dependencies = ["pyyaml"]

[project.scripts]
agents-md = "charm_tech_code.agents_md:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_tech_code"]

[dependency-groups]
unit = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff configuration is at the root of the monorepo, deliberately not repeated
# here: ruff uses the closest config it finds rather than merging, so a
# [tool.ruff] block in this file would silently override the shared one.
