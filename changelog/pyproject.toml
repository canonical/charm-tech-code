[project]
name = "charm-tech-code-changelog"
version = "0.1.0"
description = "Turn a range of commits into our changelog format."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "The Charm Tech team at Canonical Ltd."},
]
license = "Apache-2.0"
# No runtime dependencies, and that is worth keeping. The package is pure
# text-to-text: it does not talk to GitHub, run git, or read the clock, so
# there is nothing for a dependency to do.
dependencies = []

# The importable API is the package; this is the same thing wrapped for a
# workflow step, which cannot `import`. `argparse` is stdlib, so it stays a
# dependency-free package.
[project.scripts]
changelog = "charm_tech_code.changelog._cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/charm_tech_code"]

[dependency-groups]
unit = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The real ruff configuration is at the root of the monorepo; extending it
# means a setting added here overrides one key rather than the whole config.
[tool.ruff]
extend = "../pyproject.toml"

# The rest of the rule set the team agreed on (canonical/charm-tech
# `style/python.md`, "Tooling configuration"). It is here rather than at the
# root because turning it on repo-wide would newly fail `ai-failure-notifier`,
# which is already merged: eight findings, none of them this package's to fix.
# Moving these up a level is the right end state and wants its own change.
[tool.ruff.lint]
extend-select = [
    # flake8-copyright
    "CPY",
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-simplify
    "SIM",
    # ruff-specific
    "RUF",
    # perflint
    "PERF",
    # pydocstyle
    "D",
    # flake8-future-annotations
    "FA",
    # flake8-type-checking
    "TC",
]
ignore = [
    # Imports used only in annotations do not have to move into a
    # `TYPE_CHECKING` block.
    "TC001",
    "TC002",
    "TC003",
    # `assert` is fine.
    "S101",
    # Magic methods and `__init__` do not need docstrings.
    "D105",
    "D107",
    # Two pairs that selecting all of `D` turns on together and that
    # contradict each other. Ruff resolves both on its own but warns on every
    # run until one of each pair is named here.
    "D203",
    "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S105", "S106"]
